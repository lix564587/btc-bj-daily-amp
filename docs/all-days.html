    const meta = DATA.meta;
    const QUOTE_MIN = meta.quote_yi_threshold || 80.0;
    document.getElementById('meta').textContent =
      `${meta.start} → ${meta.end} · ${meta.days} 天 · 日界：${meta.boundary} · 波动点数 = 最高 − 最低 · 振幅% = 波动点数 / 开盘 × 100 · 成交额 = 1H quote 按日合计 · ≥${QUOTE_MIN}亿：${meta.quote_ge_count} 天`;

    let allRows = DATA.daily;
    let sortKey = 'd';
    let sortDir = 'desc';
    let filterText = '';
    let onlyQuote80 = false;

    function fmt(n, dec) {
      return Number(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }

    function quoteCell(yi) {
      const hot = yi >= QUOTE_MIN ? ' hot' : '';
      return `<td class="num col-quote${hot}">${fmt(yi, 2)}</td>`;
    }

    function evCell(ev) {
      const raw = (ev || '').trim();
      if (!raw) return `<td class="event event-empty">—</td>`;
      if (raw.includes('待补充')) return `<td class="event event-pending">${raw}</td>`;
      return `<td class="event event-filled">${raw}</td>`;
    }

    function compare(a, b) {
      let cmp = 0;
      if (sortKey === 'd') cmp = a.d.localeCompare(b.d);
      else cmp = (Number(a[sortKey]) || 0) - (Number(b[sortKey]) || 0);
      return sortDir === 'asc' ? cmp : -cmp;
    }

    function filtered() {
      const q = filterText.trim().toLowerCase();
      return allRows.filter(r => {
        if (onlyQuote80 && r.quote_yi < QUOTE_MIN) return false;
        if (!q) return true;
        return r.d.includes(q) || (r.event && r.event.toLowerCase().includes(q));
      });
    }

    function render() {
      const rows = [...filtered()].sort(compare);
      document.getElementById('count').textContent = `显示 ${rows.length} / ${allRows.length} 天`;
      document.getElementById('tbody').innerHTML = rows.map(r => `
        <tr>
          <td>${r.d}</td>
          <td class="num col-vol">${fmt(r.amp, 1)}</td>
          <td class="num col-pct">${fmt(r.pct, 3)}</td>
          ${quoteCell(r.quote_yi)}
          <td class="num">${fmt(r.open, 2)}</td>
          <td class="num">${fmt(r.high, 2)}</td>
          <td class="num">${fmt(r.low, 2)}</td>
          <td class="num">${fmt(r.close, 2)}</td>
          <td class="num">${fmt(r.chg, 3)}</td>
          ${evCell(r.event)}
        </tr>
      `).join('');
      document.querySelectorAll('th.sortable').forEach(th => {
        th.classList.remove('sort-asc', 'sort-desc');
        if (th.dataset.key === sortKey) th.classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
      });
    }

    document.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        else {
          sortKey = key;
          sortDir = key === 'd' ? 'desc' : 'desc';
        }
        render();
      });
    });

    document.getElementById('filter').addEventListener('input', (e) => {
      filterText = e.target.value;
      render();
    });

    document.getElementById('filter80').addEventListener('change', (e) => {
      onlyQuote80 = e.target.checked;
      render();
    });

    render();
  </script>
