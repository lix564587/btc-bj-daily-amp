    const meta = DATA.meta;
    document.getElementById('meta').textContent =
      `${meta.start} → ${meta.end} · ${meta.days} 天 · 日界：${meta.boundary} · 波动点数 = 最高 − 最低 · 振幅% = 波动点数 / 开盘 × 100`;

    let allRows = DATA.daily;
    let sortKey = 'd';
    let sortDir = 'desc';
    let filterText = '';

    function fmt(n, dec) {
      return Number(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }

    function evCell(ev) {
      const t = ev || '—';
      const cls = (t.includes('待补充') ? 'pending ' : '') + 'event';
      return `<td class="${cls}">${t}</td>`;
    }

    function compare(a, b) {
      let cmp = 0;
      if (sortKey === 'd') cmp = a.d.localeCompare(b.d);
      else cmp = (Number(a[sortKey]) || 0) - (Number(b[sortKey]) || 0);
      return sortDir === 'asc' ? cmp : -cmp;
    }

    function filtered() {
      const q = filterText.trim().toLowerCase();
      if (!q) return allRows;
      return allRows.filter(r => r.d.includes(q) || (r.event && r.event.toLowerCase().includes(q)));
    }

    function render() {
      const rows = [...filtered()].sort(compare);
      document.getElementById('count').textContent = `显示 ${rows.length} / ${allRows.length} 天`;
      document.getElementById('tbody').innerHTML = rows.map(r => `
        <tr>
          <td>${r.d}</td>
          <td class="num col-vol">${fmt(r.amp, 1)}</td>
          <td class="num col-pct">${fmt(r.pct, 3)}</td>
          <td class="num">${fmt(r.open, 2)}</td>
          <td class="num">${fmt(r.high, 2)}</td>
          <td class="num">${fmt(r.low, 2)}</td>
          <td class="num">${fmt(r.close, 2)}</td>
          <td class="num">${fmt(r.chg, 3)}</td>
          ${evCell(r.event)}
        </tr>
      `).join('');
      document.querySelectorAll('th.sortable').forEach(th => {
        th.classList.remove('sort-asc', 'sort-desc');
        if (th.dataset.key === sortKey) th.classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
      });
    }

    document.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        else {
          sortKey = key;
          sortDir = key === 'd' ? 'desc' : 'desc';
        }
        render();
      });
    });

    document.getElementById('filter').addEventListener('input', (e) => {
      filterText = e.target.value;
      render();
    });

    render();
  </script>
