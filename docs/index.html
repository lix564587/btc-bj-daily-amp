    const meta = DATA.meta;
    const pctTh = meta.pct_threshold ?? meta.early_pct_threshold ?? 10;
    const ptsTh = meta.points_threshold ?? meta.late_threshold ?? 5000;
    document.getElementById('meta').textContent =
      `区间 ${meta.start} → ${meta.end} · ${meta.days} 天 · ${meta.source} · 北京自然日 · 高波动日：振幅≥${pctTh}% 或 点数≥${ptsTh}（另含 EVENTS 手工日）`;
    document.getElementById('high-amp-title').textContent =
      `高波动日 · 振幅≥${pctTh}% 或 点数≥${ptsTh}（含手工事件日）`;

    const stats = [
      ['日均', meta.mean_amp],
      ['中位数', meta.median_amp],
      ['P90', meta.p90_amp],
      ['最大值', meta.max_amp],
    ];
    document.getElementById('stats').innerHTML = stats.map(([l,v]) =>
      `<div class="stat"><div class="label">${l}</div><div class="value">${v}</div></div>`
    ).join('');

    const dailyByDate = Object.fromEntries((DATA.daily || []).map(x => [x.d, x]));
    const enrichRow = (r) => ({
      ...r,
      pct: r.pct != null ? r.pct : (dailyByDate[r.d]?.pct ?? null),
    });

    const evCell = (ev) => {
      const t = ev || '—';
      const cls = t.includes('待补充') ? 'pending' : '';
      return `<td class="${cls}">${t}</td>`;
    };

    const mergedHighAmp = DATA.ge_high_amp || [
      ...((DATA.ge5000 || []).map(enrichRow)),
      ...((DATA.ge3000_early || []).map(enrichRow)),
    ].filter((r, i, arr) => arr.findIndex(x => x.d === r.d) === i);

    const TABLE_CFG = {
      top: { tbodyId: 'top', rows: (DATA.top15 || []).map(enrichRow), showManual: false },
      high_amp: { tbodyId: 'high_amp', rows: mergedHighAmp.map(enrichRow), showManual: true },
    };

    const sortState = {
      top: { key: 'amp', dir: 'desc' },
      high_amp: { key: 'amp', dir: 'desc' },
    };

    function rankBadge(i) {
      const n = i + 1;
      const cls = n <= 3 ? `rank-${n}` : 'rank-n';
      return `<span class="rank ${cls}">${n}</span>`;
    }

    function rowHtml(r, showManual, opts = {}) {
      const tag = showManual && r.manual ? '<span class="tag">手工</span>' : '';
      const pct = r.pct != null ? r.pct : '—';
      const dateCell = opts.rank != null
        ? `<td>${rankBadge(opts.rank)}${r.d}${tag}</td>`
        : `<td>${r.d}${tag}</td>`;
      return `<tr>${dateCell}<td class="num col-pct">${pct}</td><td class="num col-vol">${r.amp}</td>${evCell(r.event)}</tr>`;
    }

    function compareRows(a, b, key, dir) {
      let cmp = 0;
      if (key === 'd') cmp = a.d.localeCompare(b.d);
      else if (key === 'pct') cmp = (Number(a.pct) || -1) - (Number(b.pct) || -1);
      else cmp = (Number(a.amp) || 0) - (Number(b.amp) || 0);
      return dir === 'asc' ? cmp : -cmp;
    }

    function updateSortHeaders() {
      document.querySelectorAll('th.sortable').forEach(th => {
        th.classList.remove('sort-asc', 'sort-desc');
        const t = th.dataset.table;
        const k = th.dataset.key;
        const st = sortState[t];
        if (st && st.key === k) th.classList.add(st.dir === 'asc' ? 'sort-asc' : 'sort-desc');
      });
    }

    function renderDataTable(name) {
      const cfg = TABLE_CFG[name];
      const st = sortState[name];
      const sorted = [...cfg.rows].sort((a, b) => compareRows(a, b, st.key, st.dir));
      const isTop = name === 'top';
      document.getElementById(cfg.tbodyId).innerHTML = sorted.map((r, i) =>
        rowHtml(r, cfg.showManual, isTop ? { rank: i, heroAmp: true } : {})
      ).join('');
      updateSortHeaders();
    }

    document.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const name = th.dataset.table;
        const key = th.dataset.key;
        const st = sortState[name];
        if (st.key === key) st.dir = st.dir === 'asc' ? 'desc' : 'asc';
        else {
          st.key = key;
          st.dir = key === 'd' ? 'asc' : 'desc';
        }
        renderDataTable(name);
      });
    });

    Object.keys(TABLE_CFG).forEach(renderDataTable);

    const ctx = document.getElementById('chart');
    let chart;

    function makeDaily() {
      const labels = DATA.daily.map(d => d.d);
      const amps = DATA.daily.map(d => d.amp);
      const eventPts = DATA.daily.map(d => d.event ? d.amp : null);
      return {
        datasets: [
          {
            label: '日波动点数',
            data: labels.map((l,i) => ({x: l, y: amps[i]})),
            borderColor: '#5b8def',
            backgroundColor: 'rgba(91,141,239,0.15)',
            fill: true,
            pointRadius: 0,
            borderWidth: 1.2,
            tension: 0.1,
          },
          {
            label: '关键事件日',
            data: labels.map((l,i) => eventPts[i] == null ? null : ({x: l, y: eventPts[i]})),
            borderColor: '#e45756',
            backgroundColor: '#e45756',
            showLine: false,
            pointRadius: 4,
          },
        ]
      };
    }

    function makeMonthly() {
      return {
        datasets: [
          {
            label: '月均波动点数',
            data: DATA.months.map((m,i) => ({x: m + '-01', y: DATA.m_avg[i]})),
            borderColor: '#5b8def',
            backgroundColor: 'rgba(91,141,239,0.12)',
            fill: true,
            tension: 0.2,
            pointRadius: 2,
          },
          {
            label: '月内最大日波动',
            data: DATA.months.map((m,i) => ({x: m + '-01', y: DATA.m_max[i]})),
            borderColor: '#f2a93b',
            backgroundColor: 'transparent',
            tension: 0.2,
            pointRadius: 2,
          },
        ]
      };
    }

    function render(mode) {
      if (chart) chart.destroy();
      const cfg = mode === 'monthly' ? makeMonthly() : makeDaily();
      chart = new Chart(ctx, {
        type: 'line',
        data: cfg,
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'nearest', intersect: false },
          plugins: {
            legend: { labels: { color: '#c4c7cc' } },
            tooltip: {
              callbacks: {
                afterBody: (items) => {
                  if (mode !== 'daily') return [];
                  const i = items[0]?.dataIndex;
                  const row = DATA.daily[i];
                  if (!row) return [];
                  const lines = [];
                  if (row.pct != null) lines.push('振幅: ' + row.pct + '% · 点数: ' + row.amp);
                  if (row.event) lines.push('事件: ' + row.event);
                  return lines;
                }
              }
            }
          },
          scales: {
            x: {
              type: 'time',
              time: { unit: mode === 'monthly' ? 'month' : 'month' },
              ticks: { color: '#9aa0a6', maxRotation: 0 },
              grid: { color: 'rgba(255,255,255,0.06)' },
            },
            y: {
              title: { display: true, text: '波动点数 (USDT)', color: '#9aa0a6' },
              ticks: { color: '#9aa0a6' },
              grid: { color: 'rgba(255,255,255,0.06)' },
              beginAtZero: true,
            }
          }
        }
      });
    }

    document.querySelectorAll('.tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(btn.dataset.mode);
      });
    });
    render('daily');
  </script>
