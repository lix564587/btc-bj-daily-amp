<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTCUSDT 波动/成交量 时间规律（北京时）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --line: #5b8def;
      --gold: #f2a93b;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
    }
    h1 { font-size: 22px; margin: 0 0 8px; font-weight: 600; }
    h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .nav { margin-bottom: 18px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 14px; }
    .nav a { color: var(--line); text-decoration: none; }
    .nav a:hover { text-decoration: underline; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .insight {
      background: rgba(91, 141, 239, 0.08);
      border: 1px solid rgba(91, 141, 239, 0.25);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .insight strong { color: var(--gold); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .chart-wrap { position: relative; height: 280px; }
    .chart-wrap.tall { height: 320px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-weight: 500; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .tag-hi { color: #8ec5ff; }
    .tag-lo { color: #9aa0a6; }
    .tabs { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    button.tab {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    button.tab.active { border-color: var(--line); color: var(--line); }
    table.rank-table { margin-top: 12px; font-size: 12px; }
    table.rank-table th, table.rank-table td { padding: 6px 8px; }
    table.rank-table tr.rank-1 td { background: rgba(242, 169, 59, 0.12); }
    table.rank-table tr.rank-last td { background: rgba(255,255,255,0.03); color: var(--muted); }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>BTCUSDT 波动 / 成交量 · 时间规律</h1>
  <div class="sub" id="meta"></div>
  <div class="nav">
    <a href="index.html">波动走势图</a>
    <a href="all-days.html">每日全量列表</a>
  </div>
  <div class="insight" id="summary"></div>

  <div class="card">
    <h2>按年 · 大波动日频次与间隔</h2>
    <p class="sub" id="yearNote"></p>
    <div class="scroll" style="max-height:240px;overflow:auto">
      <table id="yearTable"><thead><tr>
        <th>年份</th><th class="num">天数</th><th class="num">年均波动</th><th class="num">年最大波动</th>
        <th class="num">P90波动日数</th><th class="num">P90放量日数</th>
      </tr></thead><tbody></tbody></table>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>一年中的月份（日均波动 / 成交量）</h2>
      <div class="tabs">
        <button class="tab active" data-chart="month" data-metric="amp">波动</button>
        <button class="tab" data-chart="month" data-metric="vol">成交量</button>
      </div>
      <div class="chart-wrap"><canvas id="chartMonth"></canvas></div>
    </div>
    <div class="card">
      <h2>一周中的星期</h2>
      <div class="tabs">
        <button class="tab active" data-chart="wd" data-metric="amp">波动</button>
        <button class="tab" data-chart="wd" data-metric="vol">成交量</button>
      </div>
      <div class="chart-wrap"><canvas id="chartWd"></canvas></div>
    </div>
  </div>

  <div class="card">
    <h2>一月中的日期（1–31 日，跨月平均）</h2>
    <div class="tabs">
      <button class="tab active" data-chart="dom" data-metric="amp">波动</button>
      <button class="tab" data-chart="dom" data-metric="vol">成交量</button>
    </div>
    <div class="chart-wrap tall"><canvas id="chartDom"></canvas></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>一天中的小时段（北京，区间可不等长）</h2>
      <div class="tabs">
        <button class="tab active" data-chart="sess" data-metric="amp">波动</button>
        <button class="tab" data-chart="sess" data-metric="vol">成交量</button>
      </div>
      <div class="chart-wrap"><canvas id="chartSess"></canvas></div>
      <p class="sub" id="sessRank"></p>
      <table id="sessRankTable" class="rank-table"><thead><tr>
        <th>波动/成交量名次</th><th>小时段</th><th class="num">段内均值</th><th class="num">跨度(h)</th>
      </tr></thead><tbody></tbody></table>
    </div>
    <div class="card">
      <h2>一小时内的 4 个 15 分钟</h2>
      <div class="tabs">
        <button class="tab active" data-chart="q" data-metric="vol">成交量</button>
        <button class="tab" data-chart="q" data-metric="amp">波动</button>
      </div>
      <div class="chart-wrap"><canvas id="chartQ"></canvas></div>
      <p class="sub" id="qNote"></p>
    </div>
  </div>

  <div class="card">
    <h2>按单小时（北京 00-01 … 23-24，1H K 线均值）</h2>
    <div class="tabs">
      <button class="tab active" data-chart="hour" data-metric="amp">波动</button>
      <button class="tab" data-chart="hour" data-metric="vol">成交量</button>
    </div>
    <div class="chart-wrap tall"><canvas id="chartHour"></canvas></div>
    <p class="sub" id="hourRank"></p>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>偏高 vs 偏低（日维度 · 按均值排序）</h2>
      <div id="rankDaily"></div>
    </div>
    <div class="card">
      <h2>偏高 vs 偏低（日内 · 小时段 / 15 分钟）</h2>
      <div id="rankIntra"></div>
    </div>
  </div>

const D = P.daily;

function fmt(n, d=0) {
  if (n == null || Number.isNaN(n)) return '—';
  return Number(n).toLocaleString('zh-CN', { maximumFractionDigits: d });
}

function rangeLabel(x) {
  return x.range_label || (x.range ? x.range + '时' : null) || x.key || x.label || x.hour_bj || String(x.quarter);
}

function topName(arr, field) {
  if (!arr || !arr.length) return '—';
  const x = [...arr].sort((a,b) => b[field]-a[field])[0];
  return rangeLabel(x);
}

function botName(arr, field) {
  if (!arr || !arr.length) return '—';
  const x = [...arr].sort((a,b) => a[field]-b[field])[0];
  return rangeLabel(x);
}

const HR = I1.hour_ranges || I1.session;

function sortByMetric(rows, metric) {
  const field = metric === 'vol' ? 'mean_vol' : 'mean_amp';
  return [...rows].sort((a, b) => b[field] - a[field]);
}

function rankChain(rows, metric) {
  return sortByMetric(rows, metric).map((x, i) => `第${i + 1} ${rangeLabel(x)}`).join(' → ');
}

function rankList(title, hi, lo, keyLabel='key') {
  const lbl = (x) => x[keyLabel] || x.range_label || (x.range ? x.range + '时' : x.label);
  const h = hi.slice(0,3).map((x, i) => `第${i + 1} ${lbl(x)} (${fmt(x.mean_amp || x.mean_vol, x.mean_vol>1e4?0:1)})`).join('、');
  const l = lo.slice(0,3).map((x, i) => `第${i + 1} ${lbl(x)} (${fmt(x.mean_amp || x.mean_vol, x.mean_vol>1e4?0:1)})`).join('、');
  return `<p><span class="tag-hi">${title} 偏高</span> ${h || '—'}<br><span class="tag-lo">偏低</span> ${l || '—'}</p>`;
}

function rankListFull(title, allRows, metric) {
  const field = metric === 'vol' ? 'mean_vol' : 'mean_amp';
  const sorted = sortByMetric(allRows, metric);
  const line = sorted.map((x, i) => `第${i + 1} ${rangeLabel(x)} (${fmt(x[field], x[field] > 1e4 ? 0 : 1)})`).join(' → ');
  return `<p><span class="tag-hi">${title}（${metric === 'vol' ? '成交量' : '波动'}）</span> ${line}</p>`;
}

function barChart(id, labels, data, label, color) {
  const ctx = document.getElementById(id);

  charts[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label, data, backgroundColor: color }] },
    options: chartOpts
  });
}

function renderWd(metric) {
  const rows = D.weekday.by_wd;
  barChart('chartWd', rows.map(r => r.key), rows.map(r => metric==='vol'?r.mean_vol:r.mean_amp),
    metric==='vol'?'日均成交量':'日均波动', metric==='vol'?'rgba(59,130,246,0.75)':'rgba(242,169,59,0.75)');
}
function renderDom(metric) {
  const rows = D.day_of_month.by_dom;
  barChart('chartDom', rows.map(r => r.key), rows.map(r => metric==='vol'?r.mean_vol:r.mean_amp),
    metric==='vol'?'日均成交量':'日均波动', 'rgba(91,141,239,0.65)');
}
function renderSess(metric) {
  const field = metric === 'vol' ? 'mean_vol' : 'mean_amp';
  const sorted = sortByMetric(HR.all, metric);
  const n = sorted.length;
  barChart('chartSess',
    sorted.map((r, i) => `第${i + 1}\n${r.range_label || r.range + '时'}`),
    sorted.map(r => r[field]),
    metric==='vol'?'段内均量':'段内波动', metric==='vol'?'rgba(59,130,246,0.75)':'rgba(242,169,59,0.75)');
  const hi = sorted[0];
  const lo = sorted[n - 1];
  const note = HR.note || '';
  const r1824 = sorted.findIndex(x => x.range === '18-24') + 1;
  document.getElementById('sessRank').textContent =
    `当前指标排序：第1 ${rangeLabel(hi)}（${fmt(hi[field])}）→ … → 第${n} ${rangeLabel(lo)}（${fmt(lo[field])}）` +
    (r1824 ? ` · 18-24时为第 ${r1824} 名` : '') +
    (note ? ` · ${note}` : '');
  const tb = document.querySelector('#sessRankTable tbody');
  tb.innerHTML = '';
  sorted.forEach((r, i) => {
    const tr = document.createElement('tr');
    tr.className = i === 0 ? 'rank-1' : (i === n - 1 ? 'rank-last' : '');
    tr.innerHTML = `<td>第 ${i + 1} 名</td><td>${rangeLabel(r)}</td><td class="num">${fmt(r[field], r[field] > 1e4 ? 0 : 1)}</td><td class="num">${r.span_h ?? '—'}</td>`;
    tb.appendChild(tr);
  });
  document.querySelector('#sessRankTable thead tr th:first-child').textContent =
    metric === 'vol' ? '成交量名次' : '波动名次';
}
function renderQ(metric) {
  const rows = I15.by_quarter;
  barChart('chartQ', rows.map(r => '第'+(r.quarter+1)+'段\n'+r.label), rows.map(r => metric==='vol'?r.mean_vol:r.mean_amp),
    metric==='vol'?'15m均量':'15m波动', metric==='vol'?'rgba(59,130,246,0.8)':'rgba(242,169,59,0.75)');
  document.getElementById('qNote').textContent = I15.note;
}
function renderHour(metric) {
  const rows = I1.hour.all;
  barChart('chartHour', rows.map(r => r.range_label || r.range), rows.map(r => metric==='vol'?r.mean_vol:r.mean_amp),
    metric==='vol'?'小时均量':'小时波动', 'rgba(91,141,239,0.6)');
  const hi = metric==='vol' ? I1.hour.vol_high[0] : I1.hour.amp_high[0];
  const lo = metric==='vol' ? I1.hour.vol_low[0] : I1.hour.amp_low[0];
  document.getElementById('hourRank').textContent =
    `最高：${rangeLabel(hi)} · 最低：${rangeLabel(lo)}`;
}

renderMonth('amp'); renderWd('amp'); renderDom('amp'); renderSess('amp'); renderQ('vol'); renderHour('amp');

document.querySelectorAll('button.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const chart = btn.dataset.chart;
    const metric = btn.dataset.metric;
    btn.parentElement.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (chart==='month') renderMonth(metric);
    if (chart==='wd') renderWd(metric);
    if (chart==='dom') renderDom(metric);
    if (chart==='sess') renderSess(metric);
    if (chart==='q') renderQ(metric);
    if (chart==='hour') renderHour(metric);
  });
});
</script>
</body>
</html>
