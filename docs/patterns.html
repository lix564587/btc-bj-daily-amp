<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTCUSDT 波动/成交量 时间规律（北京时）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --line: #5b8def;
      --gold: #f2a93b;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
    }
    h1 { font-size: 22px; margin: 0 0 8px; font-weight: 600; }
    h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .nav { margin-bottom: 18px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 14px; }
    .nav a { color: var(--line); text-decoration: none; }
    .nav a:hover { text-decoration: underline; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .insight {
      background: rgba(91, 141, 239, 0.08);
      border: 1px solid rgba(91, 141, 239, 0.25);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .insight strong { color: var(--gold); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .chart-wrap { position: relative; height: 280px; }
    .chart-wrap.tall { height: 320px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-weight: 500; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .tag-hi { color: #8ec5ff; }
    .tag-lo { color: #9aa0a6; }
    .tabs { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    button.tab {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    button.tab.active { border-color: var(--line); color: var(--line); }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>BTCUSDT 波动 / 成交量 · 时间规律</h1>
  <div class="sub" id="meta"></div>
  <div class="nav">
    <a href="index.html">波动走势图</a>
    <a href="all-days.html">每日全量列表</a>
  </div>
  <div class="insight" id="summary"></div>

  <div class="card">
    <h2>按年 · 大波动日频次与间隔</h2>
    <p class="sub" id="yearNote"></p>
    <div class="scroll" style="max-height:240px;overflow:auto">
      <table id="yearTable"><thead><tr>
        <th>年份</th><th class="num">天数</th><th class="num">年均波动</th><th class="num">年最大波动</th>
        <th class="num">P90波动日数</th><th class="num">P90放量日数</th>
      </tr></thead><tbody></tbody></table>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>一年中的月份（日均波动 / 成交量）</h2>
      <div class="tabs">
        <button class="tab active" data-chart="month" data-metric="amp">波动</button>
        <button class="tab" data-chart="month" data-metric="vol">成交量</button>
      </div>
      <div class="chart-wrap"><canvas id="chartMonth"></canvas></div>
    </div>
    <div class="card">
      <h2>一周中的星期</h2>
      <div class="tabs">
        <button class="tab active" data-chart="wd" data-metric="amp">波动</button>
        <button class="tab" data-chart="wd" data-metric="vol">成交量</button>
      </div>
      <div class="chart-wrap"><canvas id="chartWd"></canvas></div>
    </div>
  </div>

  <div class="card">
    <h2>一月中的日期（1–31 日，跨月平均）</h2>
    <div class="tabs">
      <button class="tab active" data-chart="dom" data-metric="amp">波动</button>
      <button class="tab" data-chart="dom" data-metric="vol">成交量</button>
    </div>
    <div class="chart-wrap tall"><canvas id="chartDom"></canvas></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>一天中的时段（1H K 线，北京开盘时刻）</h2>
      <div class="tabs">
        <button class="tab active" data-chart="sess" data-metric="amp">波动</button>
        <button class="tab" data-chart="sess" data-metric="vol">成交量</button>
      </div>
      <div class="chart-wrap"><canvas id="chartSess"></canvas></div>
      <p class="sub" id="sessRank"></p>
    </div>
    <div class="card">
      <h2>一小时内的 4 个 15 分钟</h2>
      <div class="tabs">
        <button class="tab active" data-chart="q" data-metric="vol">成交量</button>
        <button class="tab" data-chart="q" data-metric="amp">波动</button>
      </div>
      <div class="chart-wrap"><canvas id="chartQ"></canvas></div>
      <p class="sub" id="qNote"></p>
    </div>
  </div>

  <div class="card">
    <h2>按小时（北京 00–23 点，1H K 线均值）</h2>
    <div class="tabs">
      <button class="tab active" data-chart="hour" data-metric="amp">波动</button>
      <button class="tab" data-chart="hour" data-metric="vol">成交量</button>
    </div>
    <div class="chart-wrap tall"><canvas id="chartHour"></canvas></div>
    <p class="sub" id="hourRank"></p>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>偏高 vs 偏低（日维度 · 按均值排序）</h2>
      <div id="rankDaily"></div>
    </div>
    <div class="card">
      <h2>偏高 vs 偏低（日内 · 时段 / 15 分钟）</h2>
      <div id="rankIntra"></div>
    </div>
  </div>

const D = P.daily;
const I1 = P.intraday_1h;
const I15 = P.intraday_15m;
const M = P.meta;

function fmt(n, d=0) {
  if (n == null || Number.isNaN(n)) return '—';
  return Number(n).toLocaleString('zh-CN', { maximumFractionDigits: d });
}

function topName(arr, field) {
  if (!arr || !arr.length) return '—';
  const x = [...arr].sort((a,b) => b[field]-a[field])[0];
  return x.session || x.key || x.label || x.hour_bj || String(x.quarter);
}

function botName(arr, field) {
  if (!arr || !arr.length) return '—';
  const x = [...arr].sort((a,b) => a[field]-b[field])[0];
  return x.session || x.key || x.label || x.hour_bj || String(x.quarter);
}

document.getElementById('meta').textContent =
  `${M.symbol} · ${M.timezone} · 日样本 ${M.daily_start} → ${M.daily_end}（${M.daily_days} 天） · 1H ${fmt(M['1h_bars'])} 根 · 15m ${fmt(M['15m_bars'])} 根`;

const gap = D.extreme_gaps.high_amp_p90 || D.extreme_gaps.high_amp;
const gapV = D.extreme_gaps.high_vol_p90 || D.extreme_gaps.high_vol;
const gap99 = D.extreme_gaps.high_amp_p99;
const gapTop = D.extreme_gaps.top20_amp_days;
const extra = D.thresholds_extra || {};
const thr = D.thresholds;
document.getElementById('yearNote').textContent =
  `P90 大波动日（≥${fmt(thr.amp_high,0)} 点）相邻间隔中位数约 ${gap.median_gap_days ?? '—'} 天；` +
  `P99（≥${fmt(extra.amp_p99,0)} 点）约 ${gap99?.median_gap_days ?? '—'} 天（≈${gap99?.median_gap_years ?? '—'} 年）；` +
  `历史 Top20 大波动日之间约 ${gapTop?.median_gap_days ?? '—'} 天。大放量 P90 间隔约 ${gapV.median_gap_days ?? '—'} 天。`;

const focus = ['上午08-12','中午12-14','下午14-18'];
const sessAll = I1.session.all;
const sessFocus = sessAll.filter(s => focus.includes(s.session));
const ampHiS = topName(sessFocus, 'mean_amp');
const ampLoS = botName(sessFocus, 'mean_amp');
const volHiS = topName(sessFocus, 'mean_vol');
const volLoS = botName(sessFocus, 'mean_vol');
const qVolHi = topName(I15.by_quarter, 'mean_vol');
const qVolLo = botName(I15.by_quarter, 'mean_vol');
const mHi = D.month.amp_high[0];
const mLo = D.month.amp_low[0];
const wdHi = D.weekday.amp_high[0];
const wdLo = D.weekday.amp_low[0];

document.getElementById('summary').innerHTML = `
<strong>结论速览</strong>（样本内均值，非预测）<br>
· 年周期：样本内 Top20 大波动日间隔中位数约 <strong>${gapTop?.median_gap_days ?? '—'} 天</strong>；P99 级大日约 <strong>${gap99?.median_gap_days ?? '—'} 天</strong>（P90 约每 ${gap.median_gap_days ?? '—'} 天一次，偏频繁）。<br>
· 月份：波动偏高 <strong>${mHi?.key} 月</strong>（日均 ${fmt(mHi?.mean_amp)} 点），偏低 <strong>${mLo?.key} 月</strong>（${fmt(mLo?.mean_amp)} 点）。<br>
· 星期：波动偏高 <strong>${wdHi?.key}</strong>，偏低 <strong>${wdLo?.key}</strong>。<br>
· 上午/中午/下午：波动最高 <strong>${ampHiS}</strong>，最低 <strong>${ampLoS}</strong>；成交量最高 <strong>${volHiS}</strong>，最低 <strong>${volLoS}</strong>。<br>
· 每小时 4 个 15 分钟：成交量最大段 <strong>${qVolHi}</strong>，最小 <strong>${qVolLo}</strong>。
`;

const yb = document.querySelector('#yearTable tbody');
D.yearly.forEach(y => {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${y.year}</td><td class="num">${y.days}</td><td class="num">${fmt(y.mean_amp,1)}</td>
    <td class="num">${fmt(y.max_amp,0)}</td><td class="num">${y.high_amp_days}</td><td class="num">${y.high_vol_days}</td>`;
  yb.appendChild(tr);
});

function rankList(title, hi, lo, keyLabel='key') {
  const h = hi.slice(0,3).map(x => `${x[keyLabel] || x.session || x.label} (${fmt(x.mean_amp || x.mean_vol, x.mean_vol>1e4?0:1)})`).join('、');
  const l = lo.slice(0,3).map(x => `${x[keyLabel] || x.session || x.label} (${fmt(x.mean_amp || x.mean_vol, x.mean_vol>1e4?0:1)})`).join('、');
  return `<p><span class="tag-hi">${title} 偏高</span> ${h || '—'}<br><span class="tag-lo">偏低</span> ${l || '—'}</p>`;
}

document.getElementById('rankDaily').innerHTML =
  rankList('月份', D.month.amp_high, D.month.amp_low) +
  rankList('星期', D.weekday.amp_high, D.weekday.amp_low, 'key') +
  rankList('日期', D.day_of_month.amp_high, D.day_of_month.amp_low, 'key');

document.getElementById('rankIntra').innerHTML =
  rankList('时段', I1.session.amp_high, I1.session.amp_low, 'session') +
  rankList('15分钟', I15.amp_high, I15.amp_low, 'label');

const chartOpts = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: { legend: { display: false } },
  scales: {
    x: { ticks: { color: '#9aa0a6', maxRotation: 0 }, grid: { color: 'rgba(255,255,255,0.06)' } },
    y: { ticks: { color: '#9aa0a6' }, grid: { color: 'rgba(255,255,255,0.06)' } }
  }
};

const charts = {};
function barChart(id, labels, data, label, color) {
  const ctx = document.getElementById(id);
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label, data, backgroundColor: color }] },
    options: chartOpts
  });
}

function renderMonth(metric) {
  const rows = D.month.by_month;
  barChart('chartMonth', rows.map(r => r.key + '月'), rows.map(r => metric==='vol'?r.mean_vol:r.mean_amp),
    metric==='vol'?'日均成交量':'日均波动', metric==='vol'?'rgba(59,130,246,0.75)':'rgba(242,169,59,0.75)');
}
function renderWd(metric) {
  const rows = D.weekday.by_wd;
  barChart('chartWd', rows.map(r => r.key), rows.map(r => metric==='vol'?r.mean_vol:r.mean_amp),
    metric==='vol'?'日均成交量':'日均波动', metric==='vol'?'rgba(59,130,246,0.75)':'rgba(242,169,59,0.75)');
}
function renderDom(metric) {
  const rows = D.day_of_month.by_dom;
  barChart('chartDom', rows.map(r => r.key), rows.map(r => metric==='vol'?r.mean_vol:r.mean_amp),
    metric==='vol'?'日均成交量':'日均波动', 'rgba(91,141,239,0.65)');
}
function renderSess(metric) {
  const rows = I1.session.all;
  barChart('chartSess', rows.map(r => r.session), rows.map(r => metric==='vol'?r.mean_vol:r.mean_amp),
    metric==='vol'?'小时均量':'小时波动', metric==='vol'?'rgba(59,130,246,0.75)':'rgba(242,169,59,0.75)');
  const hi = metric==='vol' ? I1.session.vol_high[0] : I1.session.amp_high[0];
  const lo = metric==='vol' ? I1.session.vol_low[I1.session.vol_low.length-1] : I1.session.amp_low[I1.session.amp_low.length-1];
  document.getElementById('sessRank').textContent =
    `最高：${hi.session}（${fmt(metric==='vol'?hi.mean_vol:hi.mean_amp)}） · 最低：${lo.session}（${fmt(metric==='vol'?lo.mean_vol:lo.mean_amp)}）`;
}
function renderQ(metric) {
  const rows = I15.by_quarter;
  barChart('chartQ', rows.map(r => '第'+(r.quarter+1)+'段\n'+r.label), rows.map(r => metric==='vol'?r.mean_vol:r.mean_amp),
    metric==='vol'?'15m均量':'15m波动', metric==='vol'?'rgba(59,130,246,0.8)':'rgba(242,169,59,0.75)');
  document.getElementById('qNote').textContent = I15.note;
}
function renderHour(metric) {
  const rows = I1.hour.all;
  barChart('chartHour', rows.map(r => r.hour_bj), rows.map(r => metric==='vol'?r.mean_vol:r.mean_amp),
    metric==='vol'?'小时均量':'小时波动', 'rgba(91,141,239,0.6)');
  const hi = metric==='vol' ? I1.hour.vol_high[0] : I1.hour.amp_high[0];
  const lo = metric==='vol' ? I1.hour.vol_low[0] : I1.hour.amp_low[0];
  document.getElementById('hourRank').textContent =
    `最高：${hi.hour_bj} · 最低：${lo.hour_bj}`;
}

renderMonth('amp'); renderWd('amp'); renderDom('amp'); renderSess('amp'); renderQ('vol'); renderHour('amp');

document.querySelectorAll('button.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const chart = btn.dataset.chart;
    const metric = btn.dataset.metric;
    btn.parentElement.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (chart==='month') renderMonth(metric);
    if (chart==='wd') renderWd(metric);
    if (chart==='dom') renderDom(metric);
    if (chart==='sess') renderSess(metric);
    if (chart==='q') renderQ(metric);
    if (chart==='hour') renderHour(metric);
  });
});
</script>
